name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main depuis l'onglet Actions.
  workflow_dispatch:

# Autorisations minimales requises par actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Échoue le build si un type ne colle plus après une modif de cv.ts.
      - name: Vérification des types
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Project Pages. Pour un domaine perso : SITE_URL=https://ton-domaine.fr
          # et BASE_PATH=/ (plus un fichier public/CNAME).
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /clement-metois-portfolio

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
